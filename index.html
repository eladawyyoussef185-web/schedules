<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول الحصص المدرسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            text-align: center;
            margin: 15px 0 20px;
        }

        header .logo-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 900;
        }

        header p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
            color: var(--text);
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* أزرار مشاركة وبار كود الموقع الرئيسي */
        .main-action-btns {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 11px 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-main-share {
            background-color: #4f46e5;
            color: #fff;
        }

        .btn-main-share:hover {
            background-color: #4338ca;
        }

        .btn-main-qr {
            background-color: #0d9488;
            color: #fff;
        }

        .btn-main-qr:hover {
            background-color: #0f766e;
        }

        .btn-share {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-share:hover {
            background-color: var(--accent-hover);
        }

        .btn-qr {
            background-color: #059669;
            color: #fff;
        }

        .btn-qr:hover {
            background-color: #047857;
        }

        .schedule-display {
            margin-top: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }

        .placeholder-box {
            width: 100%;
            padding: 35px 20px;
            border-radius: 14px;
            border: 2px dashed #cbd5e1;
            background: #f1f5f9;
            text-align: center;
            color: #475569;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .placeholder-box i {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .placeholder-box h3 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
        }

        .placeholder-box p {
            font-size: 0.9rem;
            color: #64748b;
        }

        .schedule-img {
            width: 100%;
            height: auto;
            border-radius: 14px;
            display: none;
            object-fit: contain;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* نافذة الـ QR Code Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .modal-content h3 {
            font-size: 1.1rem;
            color: var(--primary);
        }

        #qrcode img {
            margin: 0 auto;
            border: 8px solid #f8fafc;
            border-radius: 12px;
        }

        .close-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            margin-top: auto;
            padding: 25px 10px 10px;
            text-align: center;
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
        }

        footer .dev {
            color: var(--primary);
            font-weight: 800;
        }

        footer .class-info {
            color: var(--accent);
            font-weight: 700;
        }

        footer .sig {
            font-family: monospace;
            font-weight: 900;
            color: var(--accent);
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-icon"><i class="fas fa-calendar-alt"></i></div>
        <h1>جدول الحصص المدرسي</h1>
        <p>اختر الصف والفصل لعرض الجدول</p>
    </header>

    <div class="container">
        <!-- اختيار الصف -->
        <div class="form-group">
            <label for="grade-select"><i class="fas fa-layer-group"></i> الصف الدراسي:</label>
            <select id="grade-select" onchange="updateClassOptions()">
                <option value="">-- اختر الصف --</option>
                <option value="1">الصف الأول الثانوي</option>
                <option value="2">الصف الثاني الثانوي</option>
            </select>
        </div>

        <!-- اختيار الفصل -->
        <div class="form-group">
            <label for="class-select"><i class="fas fa-users"></i> الفصل:</label>
            <select id="class-select" onchange="showSchedule()" disabled>
                <option value="">-- اختر الصف أولاً --</option>
            </select>
        </div>

        <!-- أزرار مشاركة وبار كود الموقع الرئيسي -->
        <div class="main-action-btns">
            <button class="btn btn-main-share" onclick="shareMainWebsite()"><i class="fas fa-globe"></i> مشاركة الموقع</button>
            <button class="btn btn-main-qr" onclick="generateMainQR()"><i class="fas fa-qrcode"></i> باركود الموقع</button>
        </div>

        <!-- عرض الجدول أو الرسالة -->
        <div id="schedule-box" class="schedule-display">
            <!-- كارت "قريباً" -->
            <div id="coming-soon" class="placeholder-box">
                <i class="fas fa-clock"></i>
                <h3 id="class-title">فصل ...</h3>
                <p>قريباً... سيتم رفع الجدول فور صدوره ⏳</p>
            </div>

            <!-- صورة الجدول -->
            <img id="schedule-img" class="schedule-img" src="" alt="جدول الفصل">

            <!-- أزرار الجدول المحدد -->
            <div class="action-btns">
                <button class="btn btn-share" onclick="shareClassLink()"><i class="fas fa-share-alt"></i> مشاركة الجدول</button>
                <button class="btn btn-qr" onclick="generateQR()"><i class="fas fa-qrcode"></i> باركود الجدول</button>
            </div>
        </div>
    </div>

    <!-- نافذة عرض الـ QR Code -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 id="qr-title">رمز QR</h3>
            <div id="qrcode"></div>
            <button class="close-btn" onclick="closeQRModal()">إغلاق</button>
        </div>
    </div>

    <footer>
        تصميم وتطوير الطالب: <span class="dev">يوسف أحمد محمود</span> <span class="class-info">(2/5)</span> © 2026<br>
        <span class="sig">jou</span>
    </footer>

    <script>
        const schedules = {
            "1-1": "", "1-2": "", "1-3": "", "1-4": "",
            "1-5": "", "1-6": "", "1-7": "", "1-8": "",
            "2-1": "", "2-2": "", "2-3": "", "2-4": "",
            "2-5": "", "2-6": "", "2-7": "", "2-8": ""
        };

        const classNames = [
            "أول (1)", "ثاني (2)", "ثالث (3)", "رابع (4)",
            "خامس (5)", "سادس (6)", "سابع (7)", "ثامن (8)"
        ];

        function getMainURL() {
            return window.location.href.split('?')[0];
        }

        function shareMainWebsite() {
            const mainURL = getMainURL();
            if (navigator.share) {
                navigator.share({
                    title: `موقع جداول الحصص المدرسية`,
                    text: `تابع جداول الحصص المدرسية من هنا:`,
                    url: mainURL
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(mainURL).then(() => {
                    alert("تم نسخ رابط الموقع الرئيسي بنجاح! يمكنك مشاركته الآن.");
                });
            }
        }

        function generateMainQR() {
            const mainURL = getMainURL();
            const qrContainer = document.getElementById('qrcode');
            
            qrContainer.innerHTML = '';
            document.getElementById('qr-title').innerText = `باركود الموقع الرئيسي 🌐`;

            new QRCode(qrContainer, {
                text: mainURL,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qr-modal').style.display = 'flex';
        }

        function updateClassOptions(selectedClassKey = null) {
            const grade = document.getElementById('grade-select').value;
            const classSelect = document.getElementById('class-select');
            const scheduleBox = document.getElementById('schedule-box');

            classSelect.innerHTML = '<option value="">-- اختر الفصل --</option>';
            scheduleBox.style.display = 'none';

            if (!grade) {
                classSelect.disabled = true;
                return;
            }

            classSelect.disabled = false;

            classNames.forEach((name, index) => {
                const opt = document.createElement('option');
                opt.value = `${grade}-${index + 1}`;
                opt.textContent = `فصل ${name}`;
                classSelect.appendChild(opt);
            });

            if (selectedClassKey) {
                classSelect.value = selectedClassKey;
                showSchedule();
            }
        }

        function showSchedule() {
            const classKey = document.getElementById('class-select').value;
            const classSelect = document.getElementById('class-select');
            const scheduleBox = document.getElementById('schedule-box');
            const comingSoonBox = document.getElementById('coming-soon');
            const scheduleImg = document.getElementById('schedule-img');
            const classTitle = document.getElementById('class-title');

            if (!classKey) {
                scheduleBox.style.display = 'none';
                return;
            }

            const selectedText = classSelect.options[classSelect.selectedIndex].text;
            const gradeText = document.getElementById('grade-select').value == "1" ? "أولى" : "ثانية";

            scheduleBox.style.display = 'flex';

            if (schedules[classKey] && schedules[classKey] !== "") {
                comingSoonBox.style.display = 'none';
                scheduleImg.src = schedules[classKey];
                scheduleImg.style.display = 'block';
            } else {
                scheduleImg.style.display = 'none';
                comingSoonBox.style.display = 'flex';
                classTitle.innerText = `جدول ${gradeText} - ${selectedText}`;
            }
        }

        function getClassURL() {
            const classKey = document.getElementById('class-select').value;
            const mainURL = getMainURL();
            return `${mainURL}?class=${classKey}`;
        }

        function shareClassLink() {
            const shareURL = getClassURL();
            const classSelect = document.getElementById('class-select');
            const selectedText = classSelect.options[classSelect.selectedIndex].text;

            if (navigator.share) {
                navigator.share({
                    title: `جدول ${selectedText}`,
                    text: `شاهد جدول ${selectedText} المدرسي:`,
                    url: shareURL
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareURL).then(() => {
                    alert("تم نسخ رابط الفصل بنجاح! يمكنك مشاركته الآن.");
                });
            }
        }

        function generateQR() {
            const shareURL = getClassURL();
            const classSelect = document.getElementById('class-select');
            const selectedText = classSelect.options[classSelect.selectedIndex].text;
            const qrContainer = document.getElementById('qrcode');
            
            qrContainer.innerHTML = '';
            document.getElementById('qr-title').innerText = `باركود جدول - ${selectedText}`;

            new QRCode(qrContainer, {
                text: shareURL,
                width: 180,
                height: 180,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qr-modal').style.display = 'flex';
        }

        function closeQRModal() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const classParam = urlParams.get('class');

            if (classParam) {
                const grade = classParam.split('-')[0];
                if (grade === "1" || grade === "2") {
                    document.getElementById('grade-select').value = grade;
                    updateClassOptions(classParam);
                }
            }
        };
    </script>
</body>
</html>
