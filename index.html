        /* دالة رندر الجداول وتوزيعها */
        function renderTimetables(filterId = 'all') {
            const grid = document.getElementById('timetable-grid');
            grid.innerHTML = '';

            const filteredClasses = filterId === 'all' 
                ? classesData 
                : classesData.filter(c => c.id === filterId);

            filteredClasses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'timetable-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3><i class="fas fa-users"></i> ${item.name}</h3>
                        <span style="color:var(--accent-gold); font-weight:800;">إشراف أ/ ولاء حسين</span>
                    </div>
                    <div class="card-body">
                        <table class="schedule-table">
                            <thead>
                                <tr>
                                    <th>اليوم</th>
                                    <th>الحصة 1</th>
                                    <th>الحصة 2</th>
                                    <th>الحصة 3</th>
                                    <th>الحصة 4</th>
                                    <th>الحصة 5</th>
                                    <th>الحصة 6</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${item.schedule.map(s => `
                                    <tr>
                                        <td><strong>${s.day}</strong></td>
                                        <td>${s.p1}</td>
                                        <td>${s.p2}</td>
                                        <td>${s.p3}</td>
                                        <td>${s.p4}</td>
                                        <td>${s.p5}</td>
                                        <td>${s.p6}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterClass(classId) {
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            renderTimetables(classId);
        }

        /* دالة مشاركة الموقع */
        function shareWebsite() {
            if (navigator.share) {
                navigator.share({
                    title: 'جدول الصف الثاني الثانوي - الأورمان',
                    text: 'جداول الحصص المعتمدة للصف الثاني الثانوي - مدرسة الأورمان الرسمية للغات',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط الموقع بنجاح! 📋✨');
            }
        }

        /* توليد الـ QR Code تلقائياً لرابط الموقع الحالي */
        window.onload = () => {
            renderTimetables('all');
            
            // توليد الـ QR Code بناءً على رابط الموقع
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 130,
                height: 130,
                colorDark: "#0b132b",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        };
