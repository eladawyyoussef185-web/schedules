<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول الحصص المدرسية | School Schedules</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-overlay: rgba(248, 250, 252, 0.88); /* طبقة لتوضيح الكلام فوق الصورة */
            --card-bg: rgba(255, 255, 255, 0.92);
            --text: #1e293b;
            /* رابط صورة الخلفية - تقدر تستبدل bg.jpg باسم الصورة بتاعتك */
            --bg-image: url('bg.jpg'); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Poppins', sans-serif; }

        body {
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        /* زر تغيير اللغة */
        .lang-switch-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        .lang-btn {
            background: var(--card-bg);
            color: var(--primary);
            border: 2px solid #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        header {
            text-align: center;
            margin: 10px 0 20px;
        }

        header .logo-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 900;
        }

        header p {
            color: #475569;
            font-size: 0.9rem;
            margin-top: 4px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
            color: var(--text);
            font-weight: 600;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* أزرار المشاركة والباركود */
        .main-action-btns, .action-btns {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 11px 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-main-share { background-color: #4f46e5; color: #fff; }
        .btn-main-share:hover { background-color: #4338ca; }

        .btn-main-qr { background-color: #0d9488; color: #fff; }
        .btn-main-qr:hover { background-color: #0f766e; }

        .btn-share { background-color: var(--accent); color: #fff; }
        .btn-share:hover { background-color: var(--accent-hover); }

        .btn-qr { background-color: #059669; color: #fff; }
        .btn-qr:hover { background-color: #047857; }

        .schedule-display {
            margin-top: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }

        .placeholder-box {
            width: 100%;
            padding: 35px 20px;
            border-radius: 14px;
            border: 2px dashed #94a3b8;
            background: rgba(241, 245, 249, 0.8);
            text-align: center;
            color: #475569;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .placeholder-box i {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .placeholder-box h3 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
        }

        .placeholder-box p {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 600;
        }

        .schedule-img {
            width: 100%;
            height: auto;
            border-radius: 14px;
            display: none;
            object-fit: contain;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        /* نافذة QR Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .modal-content h3 {
            font-size: 1.1rem;
            color: var(--primary);
        }

        #qrcode img {
            margin: 0 auto;
            border: 8px solid #f8fafc;
            border-radius: 12px;
        }

        .close-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        footer {
            margin-top: auto;
            padding: 25px 10px 10px;
            text-align: center;
            font-size: 0.88rem;
            color: #334155;
            line-height: 1.6;
            font-weight: 600;
        }

        footer .dev { color: var(--primary); font-weight: 800; }
        footer .class-info { color: var(--accent); font-weight: 700; }
        footer .sig {
            font-family: monospace;
            font-weight: 900;
            color: var(--accent);
            font-size: 1rem;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- زر تبديل اللغة -->
    <div class="lang-switch-container">
        <button class="lang-btn" onclick="toggleLanguage()">
            <i class="fas fa-globe"></i> <span id="lang-btn-text">English</span>
        </button>
    </div>

    <header>
        <div class="logo-icon"><i class="fas fa-calendar-alt"></i></div>
        <h1 id="txt-title">جدول الحصص المدرسي</h1>
        <p id="txt-subtitle">اختر الصف والفصل لعرض الجدول</p>
    </header>

    <div class="container">
        <!-- اختيار الصف -->
        <div class="form-group">
            <label id="lbl-grade" for="grade-select"><i class="fas fa-layer-group"></i> الصف الدراسي:</label>
            <select id="grade-select" onchange="updateClassOptions()">
                <option value="" id="opt-grade-default">-- اختر الصف --</option>
                <option value="1" id="opt-grade-1">الصف الأول الثانوي</option>
                <option value="2" id="opt-grade-2">الصف الثاني الثانوي</option>
            </select>
        </div>

        <!-- اختيار الفصل -->
        <div class="form-group">
            <label id="lbl-class" for="class-select"><i class="fas fa-users"></i> الفصل:</label>
            <select id="class-select" onchange="showSchedule()" disabled>
                <option value="" id="opt-class-default">-- اختر الصف أولاً --</option>
            </select>
        </div>

        <!-- أزرار مشاركة وبار كود الموقع الرئيسي -->
        <div class="main-action-btns">
            <button class="btn btn-main-share" onclick="shareMainWebsite()">
                <i class="fas fa-globe"></i> <span id="btn-txt-main-share">مشاركة الموقع</span>
            </button>
            <button class="btn btn-main-qr" onclick="generateMainQR()">
                <i class="fas fa-qrcode"></i> <span id="btn-txt-main-qr">باركود الموقع</span>
            </button>
        </div>

        <!-- عرض الجدول أو الرسالة -->
        <div id="schedule-box" class="schedule-display">
            <!-- كارت "قريباً" -->
            <div id="coming-soon" class="placeholder-box">
                <i class="fas fa-clock"></i>
                <h3 id="class-title">فصل ...</h3>
                <p id="txt-coming-soon">قريباً... سيتم رفع الجدول فور صدوره ⏳</p>
            </div>

            <!-- صورة الجدول -->
            <img id="schedule-img" class="schedule-img" src="" alt="جدول الفصل">

            <!-- أزرار الجدول المحدد -->
            <div class="action-btns">
                <button class="btn btn-share" onclick="shareClassLink()">
                    <i class="fas fa-share-alt"></i> <span id="btn-txt-share">مشاركة الجدول</span>
                </button>
                <button class="btn btn-qr" onclick="generateQR()">
                    <i class="fas fa-qrcode"></i> <span id="btn-txt-qr">باركود الجدول</span>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة عرض الـ QR Code -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h3 id="qr-title">رمز QR</h3>
            <div id="qrcode"></div>
            <button class="close-btn" id="btn-close-modal" onclick="closeQRModal()">إغلاق</button>
        </div>
    </div>

    <footer>
        <span id="footer-dev">تصميم وتطوير الطالب:</span> <span class="dev" id="footer-name">يوسف أحمد محمود</span> <span class="class-info">(2/5)</span> © 2026<br>
        <span class="sig">jou</span>
    </footer>

    <script>
        let currentLang = 'ar';

        const translations = {
            ar: {
                langBtn: "English",
                title: "جدول الحصص المدرسي",
                subtitle: "اختر الصف والفصل لعرض الجدول",
                lblGrade: "<i class='fas fa-layer-group'></i> الصف الدراسي:",
                optGradeDefault: "-- اختر الصف --",
                optGrade1: "الصف الأول الثانوي",
                optGrade2: "الصف الثاني الثانوي",
                lblClass: "<i class='fas fa-users'></i> الفصل:",
                optClassDefault: "-- اختر الفصل --",
                optClassDisabled: "-- اختر الصف أولاً --",
                btnMainShare: "مشاركة الموقع",
                btnMainQr: "باركود الموقع",
                btnShare: "مشاركة الجدول",
                btnQr: "باركود الجدول",
                comingSoon: "قريباً... سيتم رفع الجدول فور صدوره ⏳",
                close: "إغلاق",
                footerDev: "تصميم وتطوير الطالب:",
                footerName: "يوسف أحمد محمود",
                grade1Name: "أولى",
                grade2Name: "ثانية",
                classNames: ["أول (1)", "ثاني (2)", "ثالث (3)", "رابع (4)", "خامس (5)", "سادس (6)", "سابع (7)", "ثامن (8)"],
                alertShareMain: "تم نسخ رابط الموقع الرئيسي بنجاح!",
                alertShareClass: "تم نسخ رابط الفصل بنجاح!",
                qrMainTitle: "باركود الموقع الرئيسي 🌐",
                qrClassTitlePrefix: "باركود جدول - "
            },
            en: {
                langBtn: "عربي",
                title: "School Class Schedule",
                subtitle: "Select grade and class to view schedule",
                lblGrade: "<i class='fas fa-layer-group'></i> Grade Level:",
                optGradeDefault: "-- Select Grade --",
                optGrade1: "Grade 10 (1st Secondary)",
                optGrade2: "Grade 11 (2nd Secondary)",
                lblClass: "<i class='fas fa-users'></i> Class:",
                optClassDefault: "-- Select Class --",
                optClassDisabled: "-- Select Grade First --",
                btnMainShare: "Share Website",
                btnMainQr: "Website QR",
                btnShare: "Share Schedule",
                btnQr: "Schedule QR",
                comingSoon: "Coming Soon... Schedule will be uploaded soon ⏳",
                close: "Close",
                footerDev: "Designed & Developed by Student:",
                footerName: "Youssef Ahmed Mahmoud",
                grade1Name: "Grade 10",
                grade2Name: "Grade 11",
                classNames: ["10/1", "10/2", "10/3", "10/4", "10/5", "10/6", "10/7", "10/8"],
                classNames2: ["11/1", "11/2", "11/3", "11/4", "11/5", "11/6", "11/7", "11/8"],
                alertShareMain: "Website link copied successfully!",
                alertShareClass: "Class link copied successfully!",
                qrMainTitle: "Website QR Code 🌐",
                qrClassTitlePrefix: "Schedule QR - "
            }
        };

        const schedules = {
            "1-1": "", "1-2": "", "1-3": "", "1-4": "",
            "1-5": "", "1-6": "", "1-7": "", "1-8": "",
            "2-1": "", "2-2": "", "2-3": "", "2-4": "",
            "2-5": "", "2-6": "", "2-7": "", "2-8": ""
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            const t = translations[currentLang];

            document.getElementById('lang-btn-text').innerText = t.langBtn;
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-grade').innerHTML = t.lblGrade;
            document.getElementById('opt-grade-default').innerText = t.optGradeDefault;
            document.getElementById('opt-grade-1').innerText = t.optGrade1;
            document.getElementById('opt-grade-2').innerText = t.optGrade2;
            document.getElementById('lbl-class').innerHTML = t.lblClass;
            document.getElementById('btn-txt-main-share').innerText = t.btnMainShare;
            document.getElementById('btn-txt-main-qr').innerText = t.btnMainQr;
            document.getElementById('btn-txt-share').innerText = t.btnShare;
            document.getElementById('btn-txt-qr').innerText = t.btnQr;
            document.getElementById('txt-coming-soon').innerText = t.comingSoon;
            document.getElementById('btn-close-modal').innerText = t.close;
            document.getElementById('footer-dev').innerText = t.footerDev;
            document.getElementById('footer-name').innerText = t.footerName;

            // تحديث قائمة الفصول إذا كانت مفتوحة
            const grade = document.getElementById('grade-select').value;
            const currentClassVal = document.getElementById('class-select').value;
            if (grade) {
                updateClassOptions(currentClassVal);
            } else {
                document.getElementById('opt-class-default').innerText = t.optClassDisabled;
            }
        }

        function updateClassOptions(selectedClassKey = null) {
            const grade = document.getElementById('grade-select').value;
            const classSelect = document.getElementById('class-select');
            const scheduleBox = document.getElementById('schedule-box');
            const t = translations[currentLang];

            classSelect.innerHTML = `<option value="">${t.optClassDefault}</option>`;
            scheduleBox.style.display = 'none';

            if (!grade) {
                classSelect.disabled = true;
                return;
            }

            classSelect.disabled = false;

            const nameList = (currentLang === 'en' && grade === "2") ? t.classNames2 : t.classNames;

            nameList.forEach((name, index) => {
                const opt = document.createElement('option');
                opt.value = `${grade}-${index + 1}`;
                opt.textContent = currentLang === 'ar' ? `فصل ${name}` : `Class ${name}`;
                classSelect.appendChild(opt);
            });

            if (selectedClassKey) {
                classSelect.value = selectedClassKey;
                showSchedule();
            }
        }

        function showSchedule() {
            const classKey = document.getElementById('class-select').value;
            const classSelect = document.getElementById('class-select');
            const scheduleBox = document.getElementById('schedule-box');
            const comingSoonBox = document.getElementById('coming-soon');
            const scheduleImg = document.getElementById('schedule-img');
            const classTitle = document.getElementById('class-title');
            const t = translations[currentLang];

            if (!classKey) {
                scheduleBox.style.display = 'none';
                return;
            }

            const selectedText = classSelect.options[classSelect.selectedIndex].text;
            const gradeVal = document.getElementById('grade-select').value;
            const gradeText = gradeVal === "1" ? t.grade1Name : t.grade2Name;

            scheduleBox.style.display = 'flex';

            if (schedules[classKey] && schedules[classKey] !== "") {
                comingSoonBox.style.display = 'none';
                scheduleImg.src = schedules[classKey];
                scheduleImg.style.display = 'block';
            } else {
                scheduleImg.style.display = 'none';
                comingSoonBox.style.display = 'flex';
                classTitle.innerText = `${t.title} ${gradeText} - ${selectedText}`;
            }
        }

        function getMainURL() { return window.location.href.split('?')[0]; }

        function shareMainWebsite() {
            const mainURL = getMainURL();
            const t = translations[currentLang];
            if (navigator.share) {
                navigator.share({ title: t.title, url: mainURL }).catch(() => {});
            } else {
                navigator.clipboard.writeText(mainURL).then(() => alert(t.alertShareMain));
            }
        }

        function generateMainQR() {
            const mainURL = getMainURL();
            const qrContainer = document.getElementById('qrcode');
            const t = translations[currentLang];
            
            qrContainer.innerHTML = '';
            document.getElementById('qr-title').innerText = t.qrMainTitle;

            new QRCode(qrContainer, { text: mainURL, width: 180, height: 180, colorDark : "#0f172a", colorLight : "#ffffff" });
            document.getElementById('qr-modal').style.display = 'flex';
        }

        function getClassURL() {
            return `${getMainURL()}?class=${document.getElementById('class-select').value}`;
        }

        function shareClassLink() {
            const shareURL = getClassURL();
            const t = translations[currentLang];
            const selectedText = document.getElementById('class-select').options[document.getElementById('class-select').selectedIndex].text;

            if (navigator.share) {
                navigator.share({ title: selectedText, url: shareURL }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareURL).then(() => alert(t.alertShareClass));
            }
        }

        function generateQR() {
            const shareURL = getClassURL();
            const t = translations[currentLang];
            const selectedText = document.getElementById('class-select').options[document.getElementById('class-select').selectedIndex].text;
            const qrContainer = document.getElementById('qrcode');
            
            qrContainer.innerHTML = '';
            document.getElementById('qr-title').innerText = `${t.qrClassTitlePrefix}${selectedText}`;

            new QRCode(qrContainer, { text: shareURL, width: 180, height: 180, colorDark : "#0f172a", colorLight : "#ffffff" });
            document.getElementById('qr-modal').style.display = 'flex';
        }

        function closeQRModal() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const classParam = urlParams.get('class');

            if (classParam) {
                const grade = classParam.split('-')[0];
                if (grade === "1" || grade === "2") {
                    document.getElementById('grade-select').value = grade;
                    updateClassOptions(classParam);
                }
            }
        };
    </script>
</body>
</html>
